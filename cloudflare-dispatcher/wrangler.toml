name = "thesisiq-workflow-dispatcher"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
# 5 exact cron expressions matching the actual workflow schedules:
# 1 consolidated cron expression to fit within Cloudflare's limit of 5 crons:
# Runs at 03:00, 03:30, 05:00, 05:30, 08:00, 08:30, 10:00, 10:30, 14:00, 14:30, 16:00, 16:30 UTC.
# The worker index.js filters out the non-mapped hours (05:00, 08:30, 10:30, 14:00, 16:00) as no-ops.
crons = ["0,30 3,5,8,10,14,16 * * *"]

[observability.logs]
enabled = true
invocation_logs = true
