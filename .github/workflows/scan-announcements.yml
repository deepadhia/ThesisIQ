name: 📢 Corporate Announcement Scanner

# Primary execution handled 24/7 by Oracle Cloud Server PM2 Daemon.
# Secondary redundant safety net scheduled via GitHub Actions during market hours.
on:
  schedule:
    # Failover cron every 30 mins during Indian market hours (03:30 to 12:30 UTC = 09:00 to 18:00 IST, Mon-Fri)
    - cron: '*/30 3-12 * * 1-5'
  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scan but skip Telegram alerts)'
        type: boolean
        default: false
      notify_start:
        description: 'Send start notification to Telegram'
        type: boolean
        default: false

# ─── Concurrency ──────────────────────────────────────────────────────────────
# Prevent overlapping scans — complete running job before starting next run
concurrency:
  group: scan-announcements
  cancel-in-progress: false

jobs:
  scan:
    name: Scan Corporate Announcements
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js 20 (required for ESM + native fetch) ─────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
        # --omit=dev: skip devDeps (vite, typescript, etc.) — scanner doesn't need them
        # --ignore-scripts: skip postinstall hooks for speed

      # ── 4. Run the scanner ─────────────────────────────────────────────────
      - name: Run announcement scanner
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          JWT_SECRET:          ${{ secrets.JWT_SECRET }}
          NVIDIA_API_KEY:      ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pass through Actions context for richer Telegram messages
          GITHUB_ACTIONS:      'true'
          DRY_RUN:             ${{ inputs.dry_run || 'false' }}
          NOTIFY_START:        ${{ inputs.notify_start || 'false' }}
          WORKFLOW_RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node backend/scripts/scan-announcements-action.js

      # ── 5. Report failure to Telegram ─────────────────────────────────────
      # This step only runs if step 4 fails, so you know when the scanner crashes.
      - name: Notify scanner failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
              \"text\": \"🔴 *Scanner FAILED*\n\nThe announcement scanner workflow crashed.\n\n[View Run Logs →](${WORKFLOW_RUN_URL})\",
              \"parse_mode\": \"Markdown\"
            }"
